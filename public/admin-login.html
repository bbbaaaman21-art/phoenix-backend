<!DOCTYPE html>

<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <link rel="stylesheet" href="/css/admin.css">

   <!-- ICONS -->
  <link rel="icon" href="/img/logo/32.png" sizes="32x32">
  <link rel="icon" href="/img/logo/64.png" sizes="64x64">
  <link rel="apple-touch-icon" href="/img/logo/180.png">
  
<meta
  name="robots"
  content="noindex,nofollow,noarchive"
/>

</head>
<body class="admin-login">

  <h2>🔐 Admin Login</h2>

  <input id="email" placeholder="Email">
  <div class="password_wrap">
  <input id="password" type="password" placeholder="Password">

  <button type="button" class="eye_btn" onclick="togglePassword()">
    <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="#777" stroke-width="2" viewBox="0 0 24 24">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>

    <svg id="eyeClosed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="#777" stroke-width="2" viewBox="0 0 24 24">
      <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19C5 19 1 12 1 12a21.77 21.77 0 0 1 5.06-6.94"/>
      <path d="M1 1l22 22"/>
    </svg>
  </button>
</div>

<button onclick="login()">Login</button>

  <script>
    async function login() {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        })
      });

      const data = await res.json();

      if (!res.ok) {
        alert(data.message || "Login failed");
        return;
      }

      // 🔥 أهم خطوة
      if (data.user?.role !== "admin" && data.user?.role !== "super_admin") {
  alert("❌ مش مسموح");
  return;
}

      localStorage.setItem("token", data.token);

      window.location.href = "/admin.html";
    }
    function togglePassword() {
  const input = document.getElementById("password");
  const open = document.getElementById("eyeOpen");
  const closed = document.getElementById("eyeClosed");

  if (input.type === "password") {
    input.type = "text";
    open.style.display = "none";
    closed.style.display = "block";
  } else {
    input.type = "password";
    open.style.display = "block";
    closed.style.display = "none";
  }
}
  </script>

</body>
</html>
