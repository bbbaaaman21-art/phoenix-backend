<!DOCTYPE html>
<html lang="ar" dir="rtl">
 
  
<head>
  <meta charset="UTF-8">
  <title>Invoice</title>
     <!-- ICONS -->
  <link rel="icon" href="/img/logo/32.png?v=2" sizes="32x32">
  <link rel="icon" href="/img/logo/64.png?v=2" sizes="64x64">
  <link rel="apple-touch-icon" href="/img/logo/180.png?v=2">
  <style>
/* =========================================================
   ROVIX HOME - INVOICE
   A4 PRINT / PDF
========================================================= */

* {
  box-sizing: border-box;
}

html {
  direction: rtl;
}

body {
  margin: 0;
  padding: 25px;

  direction: rtl;
  text-align: right;

  font-family: Arial, Tahoma, sans-serif;
  font-size: 14px;
  line-height: 1.6;

  color: #111;
  background: #fff;

  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}


/* =========================================================
   A4 PAGE
========================================================= */

@page {
  size: A4;
  margin: 12mm;
}


/* =========================================================
   HEADER
========================================================= */

header {
  width: 100%;
  margin-bottom: 22px;
}

.header {
  width: 100%;

  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  direction: rtl;

  margin-bottom: 20px;
}


/* =========================================================
   LOGO
========================================================= */

.logo {
  display: flex;
  align-items: center;
}

.logo img {
  width: 150px;
  max-width: 100%;
  height: auto;
  object-fit: contain;
}


/* =========================================================
   CONTACT INFORMATION
========================================================= */

.contact {
  direction: ltr;
  text-align: left;

  display: flex;
  flex-direction: column;

  gap: 8px;
}

.contact > div {
  display: flex;
  align-items: center;

  gap: 8px;

  font-size: 14px;
  font-weight: 600;

  white-space: nowrap;
}

.contact img {
  width: 24px;
  height: 24px;

  object-fit: contain;

  flex-shrink: 0;
}


/* =========================================================
   CUSTOMER / INVOICE INFORMATION
========================================================= */

.box {
  width: 100%;

  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 15px;

  margin-bottom: 25px;

  direction: rtl;
}

.right,
.left {
  width: 100%;
}


/* =========================================================
   INFORMATION BOX
========================================================= */

.info-item {
  width: 100%;

  min-height: 58px;

  padding: 9px 12px;

  margin-bottom: 10px;

  border: 1px solid #222;
  border-radius: 4px;

  background: #fff;

  display: flex;
  flex-direction: column;
  justify-content: center;

  page-break-inside: avoid;
  break-inside: avoid;
}


/* آخر خانة بدون مسافة */

.right .info-item:last-child,
.left .info-item:last-child {
  margin-bottom: 0;
}


/* اسم الحقل */

.info-label {
  display: block;

  margin-bottom: 3px;

  font-size: 11px;

  line-height: 1.3;

  color: #666;

  font-weight: 700;
}


/* قيمة الحقل */

.info-value {
  display: block;

  font-size: 14px;

  line-height: 1.5;

  color: #111;

  font-weight: 600;

  word-break: break-word;
}


/* =========================================================
   LTR DATA
========================================================= */

.ltr {
  direction: ltr;

  unicode-bidi: embed;

  display: inline-block;

  text-align: left;
}


/* =========================================================
   TABLE
========================================================= */

table {
  width: 100%;

  border-collapse: collapse;

  border-spacing: 0;

  direction: rtl;

  margin-top: 25px;

  margin-bottom: 20px;

  table-layout: auto;

  page-break-inside: auto;
}


/* Table header */

thead {
  display: table-header-group;
}


/* Table footer */

tfoot {
  display: table-footer-group;
}


/* Cells */

th,
td {
  border: 1px solid #222;

  padding: 9px 8px;

  text-align: center;

  vertical-align: middle;

  line-height: 1.4;
}


/* Header */

th {
  background: #f2f2f2;

  color: #111;

  font-size: 13px;

  font-weight: 700;

  white-space: nowrap;
}


/* Body */

td {
  font-size: 12.5px;

  background: #fff;
}


/* Don't split row between pages */

tr {
  page-break-inside: avoid;

  break-inside: avoid;
}


/* =========================================================
   PRODUCT TABLE - OPTIONAL CLASSES
========================================================= */

.product-name {
  font-weight: 700;
}

.product-description {
  font-size: 12px;

  color: #555;
}

.quantity,
.price,
.item-total {
  direction: ltr;

  unicode-bidi: embed;

  white-space: nowrap;

  text-align: center;
}


/* =========================================================
   TOTAL
========================================================= */

.total {
  width: 290px;

  min-height: 55px;

  margin-top: 25px;

  margin-right: auto;

  padding: 12px 16px;

  border: 1px solid #222;

  border-radius: 4px;

  background: #eef7ed;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  text-align: center;

  font-size: 16px;

  font-weight: 700;

  page-break-inside: avoid;

  break-inside: avoid;
}


/* Total value */

.total .ltr {
  font-size: 17px;

  font-weight: 700;

  white-space: nowrap;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
  width: 100%;

  margin-top: 40px;

  padding-top: 20px;

  border-top: 1px solid #ddd;

  display: flex;

  justify-content: space-between;

  align-items: center;

  direction: ltr;

  page-break-inside: avoid;

  break-inside: avoid;
}


/* QR */

.qr {
  width: 100px;

  height: 100px;

  object-fit: contain;

  display: block;
}


/* Stamp */

.stamp {
  width: 125px;

  height: 125px;

  object-fit: contain;

  display: block;
}


/* =========================================================
   GENERAL IMAGES
========================================================= */

img {
  max-width: 100%;

  height: auto;
}


/* =========================================================
   PRINT
========================================================= */

@media print {

  html,
  body {
    width: 210mm;

    min-height: 297mm;

    margin: 0;

    padding: 0;

    background: #fff;
  }

  body {
    padding: 0;
  }

  /* Don't print browser links */

  a {
    color: inherit;

    text-decoration: none;
  }

  /* Keep boxes together */

  .box,
  .info-item,
  .total,
  .footer {
    page-break-inside: avoid;

    break-inside: avoid;
  }

  /* Keep headings with content */

  h1,
  h2,
  h3,
  h4 {
    page-break-after: avoid;

    break-after: avoid;
  }

  /* Table can continue to another page */

  table {
    page-break-inside: auto;
  }

  /* But individual rows should stay together */

  tr {
    page-break-inside: avoid;

    break-inside: avoid;
  }

  /* Repeat table header when printing multiple pages */

  thead {
    display: table-header-group;
  }

  /* Avoid empty extra space */

  p {
    orphans: 3;

    widows: 3;
  }
}


/* =========================================================
   SMALL SCREEN
========================================================= */

@media screen and (max-width: 700px) {

  body {
    padding: 15px;
  }

  .header {
    flex-direction: column;

    gap: 15px;
  }

  .box {
    grid-template-columns: 1fr;
  }

  .total {
    width: 100%;
  }

  .footer {
    flex-direction: column;

    gap: 20px;
  }
}


/* =========================================================
   VERY SMALL PRINT / PDF
========================================================= */

@media print and (max-width: 700px) {

  body {
    padding: 0;
  }
}
</style>
</head>

<body>

<div class="invoice">

  <header>
   <img src="{{LOGO}}">

    <div class="contact">
      <div>
       <img src="{{PHONE_ICON}}">
        <span>01006675938</span>
      </div>
      <div>
        <img src="{{WHATSAPP_ICON}}">
        <span>01275444579</span>
      </div>
    </div>
  </header>

  <section class="box">

   <div class="right">

  <div class="info-item">
    <span class="info-label">اسم العميل</span>
    <span class="info-value">{{NAME}}</span>
  </div>

  <div class="info-item">
    <span class="info-label">الهاتف</span>
    <span class="info-value ltr">{{PHONE}}</span>
  </div>

  <div class="info-item">
    <span class="info-label">العنوان</span>
    <span class="info-value">{{ADDRESS}}</span>
  </div>

</div>

<div class="left">

  <div class="info-item">
    <span class="info-label">رقم الفاتورة</span>
<span class="info-value ltr">{{INVOICE_NUMBER}}</span>
  </div>

  <div class="info-item">
    <span class="info-label">تاريخ الطلب</span>
    <span class="info-value ltr">{{DATE}}</span>
  </div>

  <div class="info-item">
    <span class="info-label">العملة</span>
    <span class="info-value ltr">EGP</span>
  </div>

</div>

  </section>

  <table>
    <thead>
      <tr>
        <th>المنتج</th>
        <th>الوصف</th>
        <th>الكمية</th>
        <th>السعر</th>
        <th>الإجمالي</th>
      </tr>
    </thead>

  <tbody>
  {{ITEMS}}
</tbody>

  </table>

 <div class="total">
  الإجمالي المستحق:
  <span class="ltr">{{AMOUNT}} EGP</span>
</div>

  <footer>
 <img src="{{STAMP}}">
  </footer>

</div>
<script>
  window.onload = () => {
    setTimeout(() => {
      window.print();
    }, 300);
  };
</script>
</body>
</html>
