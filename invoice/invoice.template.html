<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <title>فاتورة - Rovix Home</title>

  <style>

    /* =========================
       PAGE
    ========================= */

    @page {
      size: A4;
      margin: 12mm;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      direction: rtl;

      font-family: Arial, Tahoma, sans-serif;

      color: #111;
      background: #fff;

      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      font-size: 14px;
      line-height: 1.5;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      margin-bottom: 25px;
    }

    header > img {
      width: 150px;
      height: auto;

      object-fit: contain;
    }

    .contact {
      direction: ltr;

      display: flex;
      flex-direction: column;

      gap: 7px;

      text-align: left;
    }

    .contact div {
      display: flex;

      align-items: center;

      gap: 7px;

      font-size: 14px;
      font-weight: 600;

      white-space: nowrap;
    }

    .contact img {
      width: 22px;
      height: 22px;

      object-fit: contain;
    }


    /* =========================
       CUSTOMER / INVOICE INFO
    ========================= */

    .box {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 35px;

      margin-bottom: 28px;
    }

    .right,
    .left {
      width: 100%;
    }

    .right p,
    .left p {
      margin: 0;

      padding: 8px 3px;

      min-height: 38px;

      border-bottom: 1.5px solid #111;

      font-size: 14px;

      color: #111;
    }

    .right p:first-child,
    .left p:first-child {
      border-top: 1.5px solid #111;
    }

    .right strong,
    .left strong {
      color: #000;

      font-weight: 700;
    }

    .ltr {
      direction: ltr;

      unicode-bidi: embed;

      display: inline-block;
    }


    /* =========================
       PRODUCTS TABLE
    ========================= */

    table {
      width: 100%;

      border-collapse: collapse;

      margin-top: 10px;

      direction: rtl;

      page-break-inside: auto;
    }

    thead {
      display: table-header-group;
    }

    th,
    td {
      border: 2px solid #111;

      padding: 9px 7px;

      text-align: center;

      vertical-align: middle;

      line-height: 1.4;
    }

    th {
      background: #d6d6d6;

      color: #000;

      font-size: 13.5px;

      font-weight: 800;
    }

    td {
      background: #fff;

      color: #000;

      font-size: 12.5px;
    }

    tr {
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .product-name {
      font-weight: 700;
    }

    .product-description {
      color: #111;
      font-size: 12px;
    }

    .quantity,
    .price,
    .item-total {
      direction: ltr;

      unicode-bidi: embed;

      white-space: nowrap;

      text-align: center;
    }


  /* =========================
   TOTAL + STAMP
========================= */

.total-area {
  width: 100%;

  margin-top: 22px;

  display: flex;

  justify-content: flex-end;

  align-items: flex-start;

  gap: 12px;

  direction: rtl;

  page-break-inside: avoid;
  break-inside: avoid;
}


/* =========================
   TOTAL
========================= */

.total {
  width: 300px;

  padding: 10px 15px;

  border: 2px solid #111;

  background: #eef7ed;

  display: flex;

  flex-direction: column;

  gap: 3px;

  text-align: right;

  font-size: 15px;

  color: #000;

  font-weight: 700;

  page-break-inside: avoid;
  break-inside: avoid;
}

.total p {
  margin: 0;

  padding: 2px 0;
}

.total p:last-child {
  font-size: 17px;

  font-weight: 800;
}


/* =========================
   STAMP
========================= */

.stamp {
  width: 65px !important;

  height: 65px !important;

  max-width: 65px !important;

  max-height: 65px !important;

  object-fit: contain !important;

  display: block;

  margin: 0;

  padding: 0;
}

    /* =========================
       FOOTER / STAMP
    ========================= */

    .footer {
      margin-top: 20px;

      padding-top: 10px;

      border-top: 1.5px solid #111;

      display: flex;

      justify-content: flex-end;

      align-items: center;

      page-break-inside: avoid;
      break-inside: avoid;
    }

   

    /* =========================
       PRINT
    ========================= */

    @media print {

      html,
      body {
        width: 210mm;
        min-height: 297mm;

        margin: 0;
        padding: 0;

        background: #fff;
      }

      header,
      .box,
      .total,
      .footer {
        page-break-inside: avoid;
        break-inside: avoid;
      }

      table {
        page-break-inside: auto;
      }

      thead {
        display: table-header-group;
      }

      tr {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }

  </style>
</head>


<body>

  <div class="invoice">


    <!-- =========================
         HEADER
    ========================= -->

    <header>

      <img src="{{LOGO}}" alt="Rovix Home">

      <div class="contact">

        <div>
          <img src="{{PHONE_ICON}}" alt="">
          <span>01006675938</span>
        </div>

        <div>
          <img src="{{WHATSAPP_ICON}}" alt="">
          <span>01275444579</span>
        </div>

      </div>

    </header>


    <!-- =========================
         CUSTOMER / INVOICE INFO
    ========================= -->

    <section class="box">


      <!-- بيانات العميل - يمين -->

      <div class="right">

        <p>
          <strong>اسم العميل:</strong>
          <span>{{NAME}}</span>
        </p>

        <p>
          <strong>الهاتف:</strong>
          <span class="ltr">{{PHONE}}</span>
        </p>

        <p>
          <strong>العنوان:</strong>
          <span>{{ADDRESS}}</span>
        </p>

      </div>


      <!-- بيانات الفاتورة - شمال -->

      <div class="left">

        <p>
          <strong>رقم الفاتورة:</strong>
          <span class="ltr">{{INVOICE_NUMBER}}</span>
        </p>

        <p>
          <strong>تاريخ الطلب:</strong>
          <span class="ltr">{{DATE}}</span>
        </p>

        <p>
          <strong>العملة:</strong>
          <span class="ltr">EGP</span>
        </p>

      </div>

    </section>


    <!-- =========================
         PRODUCTS
    ========================= -->

    <table>

      <thead>

        <tr>
          <th>المنتج</th>
          <th>الوصف</th>
          <th>الكمية</th>
          <th>السعر</th>
          <th>الإجمالي</th>
        </tr>

      </thead>

      <tbody>

        {{ITEMS}}

      </tbody>

    </table>


    <!-- =========================
     TOTAL + STAMP
========================= -->

<div class="total-area">

  <div class="total">

    <p>
      الشحن:
      <span class="ltr">{{SHIPPING}} EGP</span>
    </p>

    <p>
      الإجمالي النهائي:
      <span class="ltr">{{TOTAL}} EGP</span>
    </p>

  </div>

  <img
    class="stamp"
    src="{{STAMP}}"
    alt="Stamp"
  >

</div>
    </footer>


  </div>


  <script>

    window.onload = () => {

      setTimeout(() => {

        window.print();

      }, 300);

    };

  </script>

</body>

</html>
