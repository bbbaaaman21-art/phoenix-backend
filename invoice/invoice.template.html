<!DOCTYPE html>
<html lang="ar" dir="rtl">
 
  
<head>
  <meta charset="UTF-8">
  <title>Invoice</title>
     <!-- ICONS -->
  <link rel="icon" href="/img/logo/32.png?v=2" sizes="32x32">
  <link rel="icon" href="/img/logo/64.png?v=2" sizes="64x64">
  <link rel="apple-touch-icon" href="/img/logo/180.png?v=2">
<style>

/* =========================================================
   ROVIX HOME - INVOICE
   A4 PRINT / PDF
========================================================= */

* {
  box-sizing: border-box;
}

html {
  direction: rtl;
}

body {
  margin: 0;
  padding: 25px;

  direction: rtl;
  text-align: right;

  font-family: Arial, Tahoma, sans-serif;
  font-size: 14px;
  line-height: 1.6;

  color: #111;
  background: #fff;

  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}


/* =========================================================
   A4 PAGE
========================================================= */

@page {
  size: A4;
  margin: 12mm;
}


/* =========================================================
   HEADER
========================================================= */

header {
  width: 100%;
  margin-bottom: 20px;
}

.header {
  width: 100%;

  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  direction: rtl;

  margin-bottom: 20px;
}


/* =========================================================
   LOGO
========================================================= */

.logo {
  display: flex;
  align-items: center;
}

.logo img {
  width: 150px;
  max-width: 100%;
  height: auto;
  object-fit: contain;
}


/* =========================================================
   CONTACT INFORMATION
========================================================= */

.contact {
  direction: ltr;
  text-align: left;

  display: flex;
  flex-direction: column;

  gap: 7px;
}

.contact > div {
  display: flex;
  align-items: center;

  gap: 8px;

  font-size: 14px;
  font-weight: 600;

  white-space: nowrap;
}

.contact img {
  width: 23px;
  height: 23px;

  object-fit: contain;

  flex-shrink: 0;
}


/* =========================================================
   CUSTOMER / INVOICE INFORMATION
   بدون مستطيلات - خطوط فقط
========================================================= */

.box {
  width: 100%;

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 35px;

  margin-bottom: 25px;

  direction: rtl;
}

.right,
.left {
  width: 100%;
}


/* كل سطر بيانات */

.right p,
.left p {
  width: 100%;

  margin: 0;

  padding: 9px 3px;

  border-bottom: 1.4px solid #222;

  font-size: 14px;

  line-height: 1.6;

  color: #111;

  min-height: 40px;
}


/* أول سطر */

.right p:first-child,
.left p:first-child {
  border-top: 1.4px solid #222;
}


/* اسم الحقل */

.right p strong,
.left p strong {
  color: #000;

  font-weight: 700;
}


/* =========================================================
   LTR DATA
========================================================= */

.ltr {
  direction: ltr;

  unicode-bidi: embed;

  display: inline-block;

  text-align: left;
}


/* =========================================================
   TABLE
========================================================= */

table {
  width: 100%;

  border-collapse: collapse;

  border-spacing: 0;

  direction: rtl;

  margin-top: 25px;

  margin-bottom: 20px;

  table-layout: auto;

  page-break-inside: auto;
}


/* تكرار عنوان الجدول في حالة وجود أكثر من صفحة */

thead {
  display: table-header-group;
}

tfoot {
  display: table-footer-group;
}


/* =========================================================
   TABLE CELLS
========================================================= */

th,
td {
  border: 1.4px solid #222;

  padding: 9px 8px;

  text-align: center;

  vertical-align: middle;

  line-height: 1.4;
}


/* رأس الجدول */

th {
  background: #eeeeee;

  color: #000;

  font-size: 13px;

  font-weight: 700;

  white-space: nowrap;
}


/* بيانات الجدول */

td {
  background: #fff;

  color: #111;

  font-size: 12.5px;
}


/* عدم تقسيم المنتج بين صفحتين */

tr {
  page-break-inside: avoid;

  break-inside: avoid;
}


/* =========================================================
   PRODUCT TABLE
========================================================= */

.product-name {
  font-weight: 700;

  color: #000;
}

.product-description {
  font-size: 12px;

  color: #222;
}

.quantity,
.price,
.item-total {
  direction: ltr;

  unicode-bidi: embed;

  white-space: nowrap;

  text-align: center;
}


/* =========================================================
   TOTAL
   الإجمالي يظل في خانة واضحة
========================================================= */

.total {
  width: 290px;

  min-height: 55px;

  margin-top: 25px;

  margin-right: auto;

  padding: 12px 16px;

  border: 1.4px solid #222;

  border-radius: 3px;

  background: #eef7ed;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  text-align: center;

  font-size: 16px;

  font-weight: 700;

  page-break-inside: avoid;

  break-inside: avoid;
}


/* قيمة الإجمالي */

.total .ltr {
  font-size: 17px;

  font-weight: 700;

  white-space: nowrap;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
  width: 100%;

  margin-top: 25px;

  padding-top: 14px;

  border-top: 1.4px solid #222;

  display: flex;

  justify-content: space-between;

  align-items: center;

  direction: ltr;

  page-break-inside: avoid;

  break-inside: avoid;
}


/* =========================================================
   QR CODE
========================================================= */

.qr {
  width: 80px;

  height: 80px;

  object-fit: contain;

  display: block;
}


/* =========================================================
   STAMP
========================================================= */

.stamp {
  width: 70px;

  height: 70px;

  object-fit: contain;

  display: block;
}


/* =========================================================
   GENERAL IMAGES
========================================================= */

img {
  max-width: 100%;

  height: auto;
}


/* =========================================================
   PRINT
========================================================= */

@media print {

  html,
  body {
    width: 210mm;

    min-height: 297mm;

    margin: 0;

    padding: 0;

    background: #fff;

    color: #111;
  }

  body {
    padding: 0;

    font-family: Arial, Tahoma, sans-serif;

    -webkit-print-color-adjust: exact;

    print-color-adjust: exact;
  }


  /* الروابط بدون شكل لينك */

  a {
    color: inherit;

    text-decoration: none;
  }


  /* البيانات لا تتقسم */

  .box,
  .right,
  .left,
  .total,
  .footer {
    page-break-inside: avoid;

    break-inside: avoid;
  }


  /* العناوين لا تنفصل عن المحتوى */

  h1,
  h2,
  h3,
  h4 {
    page-break-after: avoid;

    break-after: avoid;
  }


  /* الجدول يسمح له بالاستمرار في صفحة جديدة */

  table {
    page-break-inside: auto;
  }


  /* عنوان الجدول يظهر مرة أخرى في الصفحة التالية */

  thead {
    display: table-header-group;
  }


  /* صف المنتج لا يتقطع */

  tr {
    page-break-inside: avoid;

    break-inside: avoid;
  }


  /* الإجمالي والختم لا يتقسموا */

  .total,
  .footer {
    page-break-inside: avoid;

    break-inside: avoid;
  }


  /* تحسين توزيع النص */

  p {
    orphans: 3;

    widows: 3;
  }
}


/* =========================================================
   SCREEN - MOBILE
========================================================= */

@media screen and (max-width: 700px) {

  body {
    padding: 15px;
  }

  .header {
    flex-direction: column;

    gap: 15px;
  }

  .box {
    grid-template-columns: 1fr;

    gap: 15px;
  }

  .total {
    width: 100%;
  }

  .footer {
    flex-direction: row;

    gap: 15px;
  }
}


/* =========================================================
   SMALL PRINT
========================================================= */

@media print and (max-width: 700px) {

  body {
    padding: 0;
  }
}

</style>
</head>

<body>

<div class="invoice">

  <header>
   <img src="{{LOGO}}">

    <div class="contact">
      <div>
       <img src="{{PHONE_ICON}}">
        <span>01006675938</span>
      </div>
      <div>
        <img src="{{WHATSAPP_ICON}}">
        <span>01275444579</span>
      </div>
    </div>
  </header>

  <section class="box">

   <div class="right">

  <div class="info-item">
    <span class="info-label">اسم العميل</span>
    <span class="info-value">{{NAME}}</span>
  </div>

  <div class="info-item">
    <span class="info-label">الهاتف</span>
    <span class="info-value ltr">{{PHONE}}</span>
  </div>

  <div class="info-item">
    <span class="info-label">العنوان</span>
    <span class="info-value">{{ADDRESS}}</span>
  </div>

</div>

<div class="left">

  <div class="info-item">
    <span class="info-label">رقم الفاتورة</span>
    <span class="info-value ltr">{{INVOICE_NUMBER}}</span>
  </div>

  <div class="info-item">
    <span class="info-label">تاريخ الطلب</span>
    <span class="info-value ltr">{{DATE}}</span>
  </div>

  <div class="info-item">
    <span class="info-label">العملة</span>
    <span class="info-value ltr">EGP</span>
  </div>

</div>

  </section>

  <table>
    <thead>
      <tr>
        <th>المنتج</th>
        <th>الوصف</th>
        <th>الكمية</th>
        <th>السعر</th>
        <th>الإجمالي</th>
      </tr>
    </thead>

  <tbody>
  {{ITEMS}}
</tbody>

  </table>

  <div class="total">
  <p>الشحن : {{SHIPPING}} EGP</p>
  <p><strong>الإجمالي النهائي : {{TOTAL}} EGP</strong></p>
</div>

  <footer>
 <img src="{{STAMP}}">
  </footer>

</div>
<script>
  window.onload = () => {
    setTimeout(() => {
      window.print();
    }, 300);
  };
</script>
</body>
</html>
